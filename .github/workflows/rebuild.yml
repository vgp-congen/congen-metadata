# Rebuild the generated files whenever the source data changes.
#
# The point of this workflow is that a collaborator who edits metadata
# never has to install anything or run anything. Push a corrected
# README.txt, a new species, or a reviewed citation, and the generated
# files follow a couple of minutes later as a separate commit.
#
# Generated files are deliberately absent from the `paths:` filter
# below, so the commit this workflow makes cannot trigger it again. That
# is the loop guard: it is structural rather than a flag, and it cannot
# be forgotten.
name: rebuild

on:
  push:
    paths:
      # Source data — the files a human writes.
      - 'species/*/*/config.yaml'
      - 'species/*/*/sample_sheet.csv'
      - 'species/*/*/README.txt'
      - 'references/vgp_reference_genomes.csv'
      - 'references/tool_citations.yaml'
      # A citation review. This is the one source file the workflow also
      # writes (--collect removes filed blocks), so it would retrigger
      # once, find nothing left to file, write nothing, and stop. The
      # actor guard below makes that explicit rather than incidental.
      - 'references/citations-review.md'
      - '.github/workflows/rebuild.yml'

  # The push-button. Use this after an upload to GenomeArk: nothing in
  # this repository changes when new data is published, so no push
  # happens and nothing else would notice.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (e.g. "new BAMs for grus-americana on GenomeArk")'
        required: false
        default: 'manual rebuild'
      fresh:
        description: 'Ignore caches. Leave on when GenomeArk has just changed.'
        type: boolean
        required: false
        default: true

# One rebuild at a time. Two concurrent runs would race to push, and the
# loser would fail on a non-fast-forward.
concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    # Never react to our own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A runner starts empty, so without this every rebuild re-asks
      # Europe PMC about the same 115 BioProjects that have no candidate
      # — a minute of somebody else's service, for nothing. It is also
      # what makes the 30-day search TTL mean anything: a cache that
      # never survives a run expires on every run.
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: ~/.cache/congen
          key: congen-cache-${{ github.run_id }}
          restore-keys: congen-cache-

      # Pinned, not tracked. A renderer change reshapes all 79 documents
      # at once, and that should arrive as a deliberate bump to this line
      # with a reviewable diff, not overnight.
      #
      # The corollary, learned the hard way: a renderer change is not live
      # until it is tagged AND this line moves. Landing the References
      # block without bumping the pin had the rebuild re-render 53
      # documents with the previous version's placeholder, deleting 723
      # lines of citations minutes after they landed.
      #
      # congen-metadata-tools is public, so no credential is needed. If it
      # ever goes private again, replace the URL with
      #   git+https://x-access-token:${{ secrets.TOOLS_TOKEN }}@github.com/vgp-congen/congen-metadata-tools@v0.4.0
      # and add a fine-grained PAT with read access to that repo as the
      # TOOLS_TOKEN secret.
      - name: Install congen-metadata-tools
        run: pip install 'congen-metadata-tools @ git+https://github.com/vgp-congen/congen-metadata-tools@v0.4.0'

      # A stale pin fails silently by reverting: it re-renders every
      # document with an older version and deletes whatever the newer one
      # added. That is exactly what happened when the References block
      # landed against a pin one version behind — 723 lines gone, minutes
      # later, with a green tick. A warning is enough, because lagging
      # deliberately is legitimate; being unaware of it is not.
      - name: Check the pin is current
        run: |
          pinned=$(grep -om1 'congen-metadata-tools@v[0-9.]*' \
            .github/workflows/rebuild.yml | cut -d@ -f2)
          latest=$(git ls-remote --tags --refs \
            https://github.com/vgp-congen/congen-metadata-tools \
            | awk -F/ '{print $NF}' | sort -V | tail -1)
          echo "pinned $pinned, latest $latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::warning::rebuild.yml pins $pinned but $latest exists. Generated files will reflect $pinned, and anything newer will be reverted."
            echo "### Stale pin" >> "$GITHUB_STEP_SUMMARY"
            echo "Pinned \`$pinned\`; latest tag is \`$latest\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Bump the pin in \`.github/workflows/rebuild.yml\` to pick it up." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show why this ran
        run: |
          echo "event: ${{ github.event_name }}"
          echo "reason: ${{ github.event.inputs.reason }}"
          congen --version
          congen list-tools

      # 1. File any citation review that just landed. Offline. Must come
      #    first: it settles decisions that the README will quote.
      - name: File reviewed citations
        run: congen citations --collect || true

      # 2. Revalidate. --check-sra is MANDATORY, not an optimisation.
      #    Tier 5 (E001-E003) only runs behind it, and the readme gate
      #    requires each gating check to have *run*, not merely to have
      #    stayed quiet. Without this flag every record is rewritten with
      #    tier 5 skipped and all 17 citation-blocked species silently
      #    promote to "fully cited" with unverified citations. Automation
      #    is exactly where a missing flag is forgotten permanently.
      - name: Validate
        # `validate` exits 1 when any error finding exists. That is a fact
        # about the metadata, not a failure of the run: the corpus has four
        # known errors waiting on human fixes, and the documents must still
        # be regenerated and committed — the generated README is precisely
        # where those errors get announced.
        #
        # Exit 2 (misuse) and anything else still fail the job, so a real
        # breakage is not swallowed.
        run: |
          set +e
          congen validate --all --check-sra --write-reports
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::validate failed with exit $status"
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            echo "::notice::validate found error-level findings; "\
                 "regenerating anyway so the documents report them"
          fi

      # 3. Re-harvest GenomeArk, NCBI and the QC tables. Exits non-zero
      #    if any fetch failed, and leaves the previous good records in
      #    place — so an outage commits nothing rather than recording
      #    that a species has no QC tables.
      - name: Harvest
        # A manual run usually means "GenomeArk changed" — and the S3
        # listing cache lives for an hour, so a warm cache could serve a
        # listing from before the upload and miss exactly what the run
        # was triggered for. `fresh` defaults to on for that reason.
        run: |
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then
            congen readme --refresh --all --no-cache
          else
            congen readme --refresh --all
          fi

      # 4. Pull newly-seen BioProjects into the review queue. Must come
      #    after the harvest, because a new species' contributing
      #    BioProjects only become visible once dataset.json records which
      #    runs came from where.
      #
      #    Nothing else adds to the queue, so without this step a new
      #    species is counted by `--report` but never gets a block for
      #    anyone to review. It is also what lets a BioProject filed as
      #    NO PUBLICATION FOUND come back when a paper finally appears.
      #
      #    Cheap after the first run: a BioProject that is confirmed, or
      #    already queued with candidates, is skipped entirely.
      - name: Look up new BioProjects
        run: congen citations --propose

      # 5. Render. Offline and deterministic.
      - name: Render
        run: congen readme --all

      # Convergence check: after a rebuild, regenerating again must be a
      # no-op. If this fails the tools are not idempotent and the commit
      # below would churn on every push.
      - name: Assert the rebuild converged
        run: |
          congen readme --all --check
          congen validate --check-stale

      - name: Summarise
        run: |
          congen readme --gate-report
          congen citations --report

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to rebuild"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rebuild generated files

          Triggered by ${{ github.event_name }} ${{ github.sha }}.
          Generated by congen-metadata-tools; see .github/workflows/rebuild.yml."
          git push
