# snpArcher v2 Configuration Example

samples: "config/smiCra.csv"

# Optional: per-sample metadata for modules (exclude, outgroup, lat, long, etc.)
# sample_metadata: "config/sample_metadata.csv"

reference:
  name: "Sminthopsis_crassicaudata"
  source: "GCA_048593235.1"  # Can be a refseq/genbank accession, url, or path

variant_calling:
  # SET TO true BY HAND 2026-09-17: GCA_048593235.1 has 7 sequences and THREE
  # over the tabix 2^29-1 limit (757,456,671 / 684,596,898 / 656,909,261 bp;
  # 2n=14, so the chromosomes are enormous). "auto" cannot detect this on a
  # FIRST run: it reads the reference .fai, which does not exist until the
  # reference is downloaded, so it would resolve false, pick tabix, and die at
  # the first index over the limit after paying for alignment and calling.
  long_contig_mode: true
  expected_coverage: "low"  # low | high | auto (future)
  tool: "gatk" # gatk | sentieon | bcftools | deepvariant | parabricks
  ploidy: 2
  gatk:
    het_prior: 0.005
  sentieon:
    license: ""
  bcftools:
    min_mapq: 20
    min_baseq: 20
    max_depth: 250
  deepvariant:
    model_type: "WGS"
    num_shards: 8
  parabricks:
    container_image: ""  # Required if tool == "parabricks"
    num_gpus: 1
    num_cpu_threads: 16
    extra_args: ""

intervals:
  enabled: true
  min_nmer: 500
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15


callable_sites:
  generate_bed_file: True
  coverage:
    enabled: true
    fraction: 1.0
    min_coverage: auto
    max_coverage: auto
    merge_distance: 100
  mappability:
    enabled: true
    min_score: 1
    kmer: 150
    merge_distance: 100

modules:
  qc:
    enabled: true
    clusters: 3
    min_depth: 0
    google_api_key: ""
    exclude_scaffolds: ""
    max_sample_missingness: 0.80
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 0.75
      exclude_scaffolds: "mtDNA,Y"
  trackhub:
    enabled: false
    email: "example@email.com"
  mk:
    enabled: false
    gff: ""  # path to GFF annotation file (required when mk is enabled)
