# snpArcher v2 Configuration Example

samples: "config/cucCan.csv"

# Optional: per-sample metadata for modules (exclude, outgroup, lat, long, etc.)
# sample_metadata: "config/sample_metadata.csv"

reference:
  name: "Cuculus_canorus"
  source: "GCA_017976375.1"  # Can be a refseq/genbank accession, url, or path

variant_calling:
  expected_coverage: "low"  # low | high | auto (future)
  tool: "gatk" # gatk | sentieon | bcftools | deepvariant | parabricks
  ploidy: 2
  # true | false | "auto". Switches VCF/gVCF indexing from tabix to CSI, which
  # is the only format that can index a contig longer than 2^29-1 bp
  # (536,870,912). Present here so it is SETTABLE PER RUN; snpArcher defaults it
  # to "auto" when the key is absent, so leaving this line alone changes nothing.
  #
  # SET IT TO true BY HAND FOR A FIRST RUN ON A LONG-CONTIG REFERENCE. "auto"
  # decides by reading the reference .fai, and on a fresh run that file does not
  # exist yet — the reference has not been downloaded when the DAG is built — so
  # auto resolves FALSE with only a logger.warning, picks tabix, and the run dies
  # at the first index over the limit, after paying for alignment and calling.
  # snpArcher's own code says as much (workflow/rules/common.smk,
  # _resolve_long_contig_mode). It self-corrects on a RESUME, because by then the
  # .fai exists — but only after one expensive failure.
  #
  # Checked before submitting, via the NCBI datasets sequence_reports endpoint:
  #   Sminthopsis crassicaudata GCA_048593235.1 — 7 seqs, 3.24 Gb, THREE over the
  #     limit (757,456,671 / 684,596,898 / 656,909,261 bp). 2n=14, so the
  #     chromosomes are enormous. Needs true.
  #   Hemiscyllium ocellatum GCA_020745735.1 — 1963 seqs, 3.98 Gb, largest
  #     167,561,909 bp. None over. "auto" is correct and would resolve false.
  # Karyotype is the cheap tip-off: few chromosomes over a large genome means
  # long contigs. pseCor (6 over, largest 1.25 Gb) is the case that found this.
  long_contig_mode: "auto"
  gatk:
    het_prior: 0.005
  sentieon:
    license: ""
  bcftools:
    min_mapq: 20
    min_baseq: 20
    max_depth: 250
  deepvariant:
    model_type: "WGS"
    num_shards: 8
  parabricks:
    container_image: ""  # Required if tool == "parabricks"
    num_gpus: 1
    num_cpu_threads: 16
    extra_args: ""

intervals:
  enabled: true
  min_nmer: 500
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15


callable_sites:
  generate_bed_file: True
  coverage:
    enabled: true
    fraction: 1.0
    min_coverage: auto
    max_coverage: auto
    merge_distance: 100
  mappability:
    enabled: true
    min_score: 1
    kmer: 150
    merge_distance: 100

modules:
  qc:
    enabled: true
    clusters: 3
    min_depth: 0
    google_api_key: ""
    exclude_scaffolds: ""
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 0.75
      exclude_scaffolds: "mtDNA,Y"
  trackhub:
    enabled: false
    email: "example@email.com"
  mk:
    enabled: false
    gff: ""  # path to GFF annotation file (required when mk is enabled)
