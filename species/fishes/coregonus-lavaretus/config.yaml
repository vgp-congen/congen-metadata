# snpArcher v2 Configuration Example

samples: "config/corLav.csv"

# Optional: per-sample metadata for modules (exclude, outgroup, lat, long, etc.)
# sample_metadata: "config/sample_metadata.csv"

reference:
  name: "Coregonus_lavaretus"
  source: "GCA_964263955.1"  # Can be a refseq/genbank accession, url, or path

variant_calling:
  expected_coverage: "low"  # low | high | auto (future)
  tool: "gatk" # gatk | sentieon | bcftools | deepvariant | parabricks
  ploidy: 2
  gatk:
    het_prior: 0.005
  sentieon:
    license: ""
  bcftools:
    min_mapq: 20
    min_baseq: 20
    max_depth: 250
  deepvariant:
    model_type: "WGS"
    num_shards: 8
  parabricks:
    container_image: ""  # Required if tool == "parabricks"
    num_gpus: 1
    num_cpu_threads: 16
    extra_args: ""

intervals:
  enabled: true
  min_nmer: 500
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15


callable_sites:
  generate_bed_file: True
  coverage:
    enabled: true
    fraction: 1.0
    min_coverage: auto
    max_coverage: auto
    merge_distance: 100
  mappability:
    enabled: true
    min_score: 1
    kmer: 150
    merge_distance: 100

modules:
  qc:
    enabled: true
    clusters: 3
    min_depth: 0
    # Raised from the snpArcher default of 0.49 on 2026-08-17 at the operator's
    # instruction, to unblock qc_admixture. At 0.49 plink2 --mind dropped 29 of 61
    # samples, then both plink calls wrote all 106,247 variants with no --geno
    # filter, so loci carried only by the dropped 29 were all-missing and
    # ADMIXTURE 1.3.0 aborted. At 0.80 --mind drops nobody. Schema allows 0-1.
    max_sample_missingness: 0.80
    google_api_key: ""
    exclude_scaffolds: ""
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 0.75
      exclude_scaffolds: "mtDNA,Y"
  trackhub:
    enabled: false
    email: "example@email.com"
  mk:
    enabled: false
    gff: ""  # path to GFF annotation file (required when mk is enabled)
